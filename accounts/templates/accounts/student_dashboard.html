<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #f1f5f9; }
        .topbar { background: #1e293b; border-bottom: 1px solid #334155; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .topbar h1 { font-size: 1.1rem; font-weight: 700; margin: 0; color: #f1f5f9; }
        .badge-role { background: #f59e0b; color: #fff; font-size: 0.75rem; padding: 0.25rem 0.75rem; border-radius: 999px; font-weight: 600; }
        .main { padding: 2rem; }
        .welcome-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.5rem 2rem; }
        .welcome-card h2 { font-size: 1.3rem; font-weight: 700; color: #f1f5f9; }
        .welcome-card p { color: #94a3b8; margin: 0; font-size: 0.9rem; }
        .btn-logout { background: transparent; border: 1px solid #ef4444; color: #ef4444; border-radius: 8px; padding: 0.4rem 1rem; font-size: 0.875rem; text-decoration: none; }
        .btn-logout:hover { background: #ef4444; color: #fff; }
    </style>
</head>
<body>
<div class="topbar">
    <div class="d-flex align-items-center gap-3">
        <h1>Teacher Evaluation</h1>
        <span class="badge-role">Student</span>
    </div>
    <div class="d-flex align-items-center gap-4">
        <span style="color:#94a3b8; font-size:0.875rem;">{{ request.user.email }}</span>
        <a href="{% url 'logout' %}" class="btn-logout">Logout</a>
    </div>
</div>
<div class="main">
    <div class="welcome-card">
        <h2>Welcome, {{ request.user.get_full_name|default:request.user.username }} 👋</h2>
        <p>You are logged in as Student. You will be able to evaluate your teachers once evaluations are open.</p>
    </div>
</div>
</body>
</html>
