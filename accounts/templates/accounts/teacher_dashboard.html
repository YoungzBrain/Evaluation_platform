<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #f1f5f9; }
        .topbar { background: #1e293b; border-bottom: 1px solid #334155; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .topbar h1 { font-size: 1.1rem; font-weight: 700; margin: 0; color: #f1f5f9; }
        .badge-role { background: #10b981; color: #fff; font-size: 0.75rem; padding: 0.25rem 0.75rem; border-radius: 999px; font-weight: 600; }
        .nav-link { color: #94a3b8; font-size: 0.875rem; text-decoration: none; }
        .nav-link:hover { color: #f1f5f9; }
        .nav-link.active { color: #10b981; font-weight: 600; }
        .main { padding: 2rem; }
        .welcome-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.5rem 2rem; margin-bottom: 2rem; }
        .welcome-card h2 { font-size: 1.3rem; font-weight: 700; color: #f1f5f9; }
        .welcome-card p { color: #94a3b8; margin: 0; font-size: 0.9rem; }
        .action-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.5rem; text-decoration: none; display: block; transition: all 0.2s; color: #f1f5f9; }
        .action-card:hover { border-color: #10b981; transform: translateY(-3px); color: #f1f5f9; }
        .action-card .icon { font-size: 2rem; margin-bottom: 0.75rem; }
        .action-card h5 { font-weight: 700; margin-bottom: 0.25rem; }
        .action-card p { color: #94a3b8; font-size: 0.875rem; margin: 0; }
        .btn-logout { background: transparent; border: 1px solid #ef4444; color: #ef4444; border-radius: 8px; padding: 0.4rem 1rem; font-size: 0.875rem; text-decoration: none; }
        .btn-logout:hover { background: #ef4444; color: #fff; }
    </style>
</head>
<body>
<div class="topbar">
    <div class="d-flex align-items-center gap-3">
        <h1>Teacher Evaluation</h1>
        <span class="badge-role">Teacher</span>
    </div>
    <div class="d-flex align-items-center gap-4">
        <a href="{% url 'teacher_dashboard' %}" class="nav-link active">Dashboard</a>
        <a href="{% url 'teacher_results' %}" class="nav-link">My Results</a>
        <a href="{% url 'logout' %}" class="btn-logout">Logout</a>
    </div>
</div>
<div class="main">
    <div class="welcome-card">
        <h2>Welcome, {{ request.user.get_full_name|default:request.user.username }} 👋</h2>
        <p>Here is your evaluation dashboard. Consult your results below.</p>
    </div>
    <div class="row g-3">
        <div class="col-md-4">
            <a href="{% url 'teacher_results' %}" class="action-card">
                <div class="icon">📊</div>
                <h5>My Results</h5>
                <p>View your evaluation scores by course and download your report.</p>
            </a>
        </div>
    </div>
</div>
</body>
</html>
