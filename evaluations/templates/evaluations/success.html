<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluation Submitted</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .success-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 3rem; text-align: center; max-width: 460px; }
        .success-icon { font-size: 3.5rem; margin-bottom: 1rem; }
        .success-card h2 { font-weight: 700; color: #10b981; margin-bottom: 0.5rem; }
        .success-card p { color: #94a3b8; margin-bottom: 2rem; }
        .btn-home { background: #f59e0b; border: none; color: #fff; border-radius: 8px; padding: 0.7rem 2rem; font-weight: 600; text-decoration: none; }
        .btn-home:hover { background: #d97706; color: #fff; }
    </style>
</head>
<body>
<div class="success-card">
    <div class="success-icon">✅</div>
    <h2>Evaluation Submitted!</h2>
    <p>Your evaluation has been recorded successfully. Thank you for your feedback.</p>
    <a href="{% url 'teachers_list' %}" class="btn-home">Evaluate Another Teacher</a>
</div>
</body>
</html>
