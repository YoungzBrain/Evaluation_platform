<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Question — Teacher Evaluation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #f1f5f9; }
        .topbar { background: #1e293b; border-bottom: 1px solid #334155; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .topbar h1 { font-size: 1.1rem; font-weight: 700; margin: 0; }
        .badge-role { background: #6366f1; color: #fff; font-size: 0.75rem; padding: 0.25rem 0.75rem; border-radius: 999px; font-weight: 600; }
        .nav-link { color: #94a3b8; font-size: 0.875rem; text-decoration: none; }
        .nav-link:hover { color: #f1f5f9; }
        .nav-link.active { color: #6366f1; font-weight: 600; }
        .btn-logout { background: transparent; border: 1px solid #ef4444; color: #ef4444; border-radius: 8px; padding: 0.4rem 1rem; font-size: 0.875rem; text-decoration: none; }
        .btn-logout:hover { background: #ef4444; color: #fff; }
        .main { padding: 2rem; max-width: 640px; }
        .form-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 2rem; }
        .form-card h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 1.5rem; }
        .form-label { color: #94a3b8; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; }
        .form-control, .form-select { background: #0f172a; border: 1px solid #334155; color: #f1f5f9; border-radius: 8px; padding: 0.6rem 0.9rem; font-size: 0.9rem; }
        .form-control:focus, .form-select:focus { background: #0f172a; border-color: #6366f1; color: #f1f5f9; box-shadow: 0 0 0 3px rgba(99,102,241,0.2); outline: none; }
        textarea.form-control { min-height: 100px; resize: vertical; }
        .type-options { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        .type-card { background: #0f172a; border: 2px solid #334155; border-radius: 10px; padding: 1rem; cursor: pointer; transition: border-color 0.15s; }
        .type-card:has(input:checked) { border-color: #6366f1; background: #1a1f3a; }
        .type-card input { display: none; }
        .type-card .tc-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 0.25rem; }
        .type-card .tc-desc { font-size: 0.78rem; color: #94a3b8; }
        .scored-color { color: #7dd3fc; }
        .open-color { color: #c4b5fd; }
        .btn-submit { background: #6366f1; color: #fff; border: none; border-radius: 8px; padding: 0.6rem 1.5rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
        .btn-submit:hover { background: #4f46e5; }
        .btn-cancel { color: #94a3b8; text-decoration: none; font-size: 0.875rem; }
        .btn-cancel:hover { color: #f1f5f9; }
        .form-select option { background: #1e293b; }
    </style>
</head>
<body>
<div class="topbar">
    <div class="d-flex align-items-center gap-3">
        <h1>Teacher Evaluation</h1>
        <span class="badge-role">Admin</span>
    </div>
    <div class="d-flex align-items-center gap-4">
        <a href="{% url 'admin_dashboard' %}" class="nav-link">Dashboard</a>
        <a href="{% url 'teachers_list' %}" class="nav-link">Teachers</a>
        <a href="{% url 'students_list' %}" class="nav-link">Students</a>
        <a href="{% url 'courses_list' %}" class="nav-link">Courses</a>
        <a href="{% url 'questions_list' %}" class="nav-link active">Questions</a>
        <a href="{% url 'logout' %}" class="btn-logout">Logout</a>
    </div>
</div>
<div class="main">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} mb-3">{{ message }}</div>
        {% endfor %}
    {% endif %}
    <div class="form-card">
        <h2>✏️ Edit Question</h2>
        <form method="post">
            {% csrf_token %}

            <div class="mb-4">
                <div class="form-label">Question Text *</div>
                <textarea name="text" class="form-control" required>{{ question.text }}</textarea>
            </div>

            <div class="mb-4">
                <div class="form-label">Question Type *</div>
                <div class="type-options">
                    <label class="type-card">
                        <input type="radio" name="type" value="scored" {% if question.type == 'scored' %}checked{% endif %}>
                        <div class="tc-title scored-color">⭐ Scored</div>
                        <div class="tc-desc">Student gives a score from 1 to 5</div>
                    </label>
                    <label class="type-card">
                        <input type="radio" name="type" value="open" {% if question.type == 'open' %}checked{% endif %}>
                        <div class="tc-title open-color">✍️ Open</div>
                        <div class="tc-desc">Student writes a free-text answer</div>
                    </label>
                </div>
            </div>

            <div class="mb-4">
                <div class="form-label">Category</div>
                <select name="category_id" class="form-select">
                    <option value="">— No category —</option>
                    {% for cat in categories %}
                        <option value="{{ cat.pk }}" {% if question.category_id == cat.pk %}selected{% endif %}>{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="d-flex align-items-center gap-3">
                <button type="submit" class="btn-submit">Save Changes</button>
                <a href="{% url 'questions_list' %}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
